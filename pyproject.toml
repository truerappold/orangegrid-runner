[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ogrun"
version = "0.1.0"
description = "Run any analysis script over many inputs on Syracuse University's OrangeGrid (HTCondor)"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
ogrun = "ogrun.cli:main"

[tool.setuptools]
packages = ["ogrun"]
